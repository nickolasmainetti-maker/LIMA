
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Formatação de links em HTML e CSS">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de Links</title>
    <style>
        body{
            background-color: black;
    
        }
        h1 {
            color:hotpink;
        }
        /* Link normal */
        a:link {
            color: blue;
            text-decoration: none;
            /* text-decoration: none; */
        }
        /* Link visitado */
        a:visited {
            color: yellow;
        }
        /* Quando o mouse passa por cima do link */
        a:hover {
            color: red;
            font-size: 40px;
            text-decoration: underline;
        }
        /* Enquanto o link é clicado */
        a:active {
            color: rgb(255, 115, 0);
            text-decoration: none;
        }

    </style>
</head>
<body>
    <h1>Formatação de links em CSS</h1>
    <p><a href="#">Formatação de Links</a></p>
</body>
</html>
